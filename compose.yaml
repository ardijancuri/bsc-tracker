services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bscan
      POSTGRES_USER: bscan
      POSTGRES_PASSWORD: ${BSCAN_DB_PASSWORD:?Set BSCAN_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - bscan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bscan -d bscan"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: "3300"
      DATABASE_URL: postgres://bscan:${BSCAN_DB_PASSWORD}@127.0.0.1:5434/bscan
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "dist-server/index.js"]

  worker:
    build: .
    restart: unless-stopped
    network_mode: host
    environment:
      DATABASE_URL: postgres://bscan:${BSCAN_DB_PASSWORD}@127.0.0.1:5434/bscan
      GMGN_API_KEY: ${GMGN_API_KEY:-}
      BSC_RPC_HTTP: http://127.0.0.1:8545
      BSC_RPC_WS: ws://127.0.0.1:8546
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "dist-server/worker.js"]

volumes:
  bscan_pgdata:
