services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bscan
      POSTGRES_USER: bscan
      POSTGRES_PASSWORD: ${BSCAN_DB_PASSWORD:?Set BSCAN_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - bscan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bscan -d bscan"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      PORT: "3300"
      DATABASE_URL: postgres://bscan:${BSCAN_DB_PASSWORD}@127.0.0.1:5434/bscan
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://kollens.com}
      TELEGRAM_CLIENT_ID: ${TELEGRAM_CLIENT_ID:-}
      TELEGRAM_CLIENT_SECRET: ${TELEGRAM_CLIENT_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TOKEN_CHART_CACHE_DIR: /app/.cache/token-charts
      BSC_INVENTORY_ARCHIVE_RPC_HTTP: ${BSC_INVENTORY_ARCHIVE_RPC_HTTP:-}
      FRONTEND_ASSET_CACHE_DIR: /app/.cache/frontend-assets
      GMGN_API_KEY: ${GMGN_API_KEY:-}
      GMGN_CHART_API_KEY: ${GMGN_CHART_API_KEY:-${GMGN_API_KEY:-}}
      GMGN_ACCOUNTING_API_KEY: ${GMGN_ACCOUNTING_API_KEY:-}
      GMGN_REQUEST_DIAGNOSTICS: ${GMGN_REQUEST_DIAGNOSTICS:-false}
      CMC_CHART_MAX_CANDLES: ${CMC_CHART_MAX_CANDLES:-1000}
    volumes:
      - bscan_chartcache:/app/.cache/token-charts
      - bscan_frontendassets:/app/.cache/frontend-assets
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "dist-server/index.js"]

  worker:
    build: .
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      TELEGRAM_CLIENT_ID: ${TELEGRAM_CLIENT_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DATABASE_URL: postgres://bscan:${BSCAN_DB_PASSWORD}@127.0.0.1:5434/bscan
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://kollens.com}
      GMGN_API_KEY: ${GMGN_API_KEY:-}
      GMGN_CHART_API_KEY: ${GMGN_CHART_API_KEY:-${GMGN_API_KEY:-}}
      GMGN_ACCOUNTING_API_KEY: ${GMGN_ACCOUNTING_API_KEY:-}
      GMGN_REQUEST_DIAGNOSTICS: ${GMGN_REQUEST_DIAGNOSTICS:-false}
      GMGN_LEGACY_PROFIT_SNAPSHOTS: ${GMGN_LEGACY_PROFIT_SNAPSHOTS:-false}
      BSC_RPC_HTTP: http://127.0.0.1:8545
      BSC_RPC_WS: ws://127.0.0.1:8546
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "dist-server/worker.js"]

volumes:
  bscan_pgdata:
  bscan_chartcache:
  bscan_frontendassets:
