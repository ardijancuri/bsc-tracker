<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <title>Kollens Flat Cut</title>
  <desc>The current five curved bent shutter strokes with flat end caps and crisp mitered bends. One blade repeats at exact 72-degree intervals.</desc>
  <defs><path id="11-flat-cut-blade" d="M64 17 A47 47 0 0 1 95.45 29.07 L81 52"/></defs>
  <g fill="none" stroke="#F9C932" stroke-width="16" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="3">
    <use href="#11-flat-cut-blade" transform="rotate(0 64 64)"/>
    <use href="#11-flat-cut-blade" transform="rotate(72 64 64)"/>
    <use href="#11-flat-cut-blade" transform="rotate(144 64 64)"/>
    <use href="#11-flat-cut-blade" transform="rotate(216 64 64)"/>
    <use href="#11-flat-cut-blade" transform="rotate(288 64 64)"/>
  </g>
</svg>
